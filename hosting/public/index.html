<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foqui</title>
    <link rel="icon" href="/logo.png" />
    <style>
      :root {
        color-scheme: dark;
        --canvas: #000;
        --text: #fff;
        --muted: #8e8e93;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--canvas);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { text-align: center; }
      img {
        width: 88px;
        height: 88px;
        border-radius: 22px;
      }
      h1 {
        margin: 24px 0 8px;
        font-size: 28px;
        letter-spacing: -0.4px;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 17px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="Foqui" />
      <h1>Foqui</h1>
      <p>Focus sessions that block the apps you choose.</p>
    </main>
  </body>
</html>
