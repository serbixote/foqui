<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Join a Foqui session</title>
    <link rel="icon" href="/logo.png" />
    <style>
      :root {
        color-scheme: dark;
        --violet: #8154e8;
        --canvas: #000;
        --text: #fff;
        --muted: #8e8e93;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--canvas);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(420px, calc(100% - 48px));
        text-align: center;
      }
      img {
        width: 88px;
        height: 88px;
        border-radius: 22px;
      }
      h1 {
        margin: 24px 0 8px;
        font-size: 28px;
        letter-spacing: -0.4px;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.4;
      }
      a {
        display: none;
        margin-top: 28px;
        padding: 14px 22px;
        border-radius: 14px;
        background: var(--violet);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="Foqui" />
      <h1>Join a Foqui session</h1>
      <p>Open this link on your iPhone with Foqui installed.</p>
      <a id="store" href="">Get Foqui</a>
    </main>
    <script>
      // Set this when Foqui is on the App Store. Empty hides the button.
      const APP_STORE_URL = "";
      if (APP_STORE_URL) {
        const store = document.getElementById("store");
        store.href = APP_STORE_URL;
        store.style.display = "inline-block";
      }
    </script>
  </body>
</html>
