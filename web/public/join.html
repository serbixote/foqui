<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Join a Foqui session</title>
    <meta name="description" content="Open this link on your phone with Foqui installed." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#322c48" />
    <link rel="icon" href="/icon.png" type="image/png" />
    <link rel="canonical" href="https://foqui.theboringbuilders.xyz/join" />
    <style>
      :root {
        color-scheme: dark;
        --violet: #8154e8;
        --paper: #322c48;
        --lilac: #443c62;
        --ink: #f4f0fa;
        --muted: #b9b0cc;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(130% 90% at 50% -8%, var(--lilac) 0%, var(--paper) 72%);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      }
      main {
        width: min(420px, calc(100% - 48px));
        text-align: center;
      }
      img {
        width: 180px;
        height: auto;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.7px;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.4;
      }
      a {
        display: none;
        margin-top: 28px;
        min-height: 52px;
        padding: 14px 22px;
        border-radius: 999px;
        background: var(--violet);
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.2px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/foqui.webp" alt="" width="1200" height="900" />
      <h1>Join a Foqui session</h1>
      <p>Open this link on your phone with Foqui installed.</p>
      <a id="store" href="">Get Foqui</a>
    </main>
    <script>
      const APP_STORE_URL = "";
      if (APP_STORE_URL) {
        const store = document.getElementById("store");
        store.href = APP_STORE_URL;
        store.style.display = "inline-flex";
        store.style.alignItems = "center";
      }
    </script>
  </body>
</html>
